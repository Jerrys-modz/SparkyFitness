limit_req_zone $binary_remote_addr zone=login_signup_zone:10m rate=5r/s;

# Home Assistant Ingress serves this app from a per-install path like
# /api/hassio_ingress/<token>/ on Home Assistant's own origin. The Supervisor
# (always 172.30.32.2) strips that prefix before proxying here and sends it in
# X-Ingress-Path. The header is only honoured from the Supervisor and only in
# that exact shape, so a direct-port client can't inject it into index.html.
# Empty for direct port access, which makes everything below a no-op.
map "$remote_addr|$http_x_ingress_path" $ingress_path {
  default                                                   "";
  "~^172\.30\.32\.2\|(?<p>/api/hassio_ingress/[A-Za-z0-9_-]+)$"  $p;
}

# Value for the patched index.html's <base href="/"> (see
# patch-ingress-paths.sh), so relative asset paths and ingress-shim.js resolve
# back through the ingress proxy instead of Home Assistant's own routes.
map $ingress_path $ingress_base_href {
  ""       "/";
  default  "$ingress_path/";
}

# Under Ingress the browser's Origin is Home Assistant's URL (for example
# http://homeassistant.local:8123 or a Nabu Casa address), which Better Auth
# would reject as untrusted on sign-in. The Supervisor has already
# authenticated the Home Assistant user, so present the add-on's own
# frontend_url instead. Direct port access keeps the browser's Origin.
map $ingress_path $upstream_origin {
  ""       $http_origin;
  default  "${SPARKY_FITNESS_FRONTEND_URL}";
}

server {
  listen ${NGINX_LISTEN_PORT};
  server_name localhost;

  # No HSTS (the add-on is typically served over HTTP on the LAN) and allow
  # Home Assistant dashboards to iframe the UI.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; font-src 'self' https:; frame-ancestors 'self' http: https:;" always;

  root /usr/share/nginx/html;
  index index.html index.htm;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;
  gzip_disable "MSIE [1-6]\.";

  location = /addon-health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location ^~ /api/auth/ {
      limit_req zone=login_signup_zone burst=10 nodelay;
      proxy_pass http://${SPARKY_FITNESS_SERVER_HOST}:${SPARKY_FITNESS_SERVER_PORT};
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Origin $upstream_origin;
  }

  location ~ ^/api/health(/|$) {
    deny all;
    access_log off;
  }

  location /health-data {
    proxy_pass http://${SPARKY_FITNESS_SERVER_HOST}:${SPARKY_FITNESS_SERVER_PORT}/api/health-data;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /uploads/ {
    proxy_pass http://${SPARKY_FITNESS_SERVER_HOST}:${SPARKY_FITNESS_SERVER_PORT}/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location ^~ /api/ {
    proxy_pass http://${SPARKY_FITNESS_SERVER_HOST}:${SPARKY_FITNESS_SERVER_PORT};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $upstream_origin;

    proxy_buffer_size 16k;
    proxy_buffers 16 64k;
    proxy_busy_buffers_size 128k;
  }

  location ^~ /mcp {
    proxy_pass http://${SPARKY_FITNESS_SERVER_HOST}:${SPARKY_FITNESS_SERVER_PORT};
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, no-transform, immutable";
    try_files $uri =404;
  }

  location = /manifest.json {
    add_header Access-Control-Allow-Origin "${SPARKY_FITNESS_FRONTEND_URL}" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    if ($request_method = OPTIONS) {
      return 204;
    }
  }

  location ^~ /locales/ {
    add_header Access-Control-Allow-Origin "${SPARKY_FITNESS_FRONTEND_URL}" always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type" always;
    if ($request_method = OPTIONS) {
      return 204;
    }
    expires 1d;
    add_header Cache-Control "public";
  }

  location ~* \.(?:png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 7d;
    add_header Cache-Control "public, no-transform, immutable";
  }

  location / {
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    sub_filter '<base href="/">' '<base href="$ingress_base_href">';
    sub_filter_once on;
    try_files $uri $uri/ /index.html;
  }

  client_max_body_size 10m;
  proxy_connect_timeout 60s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;

  access_log ${NGINX_ACCESS_LOG};
  error_log ${NGINX_ERROR_LOG} warn;
}
