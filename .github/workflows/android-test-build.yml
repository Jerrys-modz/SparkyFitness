name: Android Test Build

# Manual build of a sideloadable phone APK and Wear OS APK for device testing.
# The phone APK is the release variant (JavaScript bundled, so no Metro dev
# server is needed) signed with the debug key, so it needs none of the release
# signing secrets. The dev variant installs next to a Play Store install.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_VARIANT: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies and prebuild
        env:
          GOOGLE_MAPS_ANDROID_API_KEY: ${{ secrets.GOOGLE_MAPS_ANDROID_API_KEY }}
        run: |
          pnpm install --frozen-lockfile
          cd SparkyFitnessMobile
          npx expo prebuild --platform android

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > SparkyFitnessMobile/android/local.properties
          chmod +x SparkyFitnessMobile/android/gradlew

      - name: Build phone APK (release, debug-signed)
        working-directory: SparkyFitnessMobile/android
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Build Wear OS APK
        working-directory: SparkyFitnessMobile/android
        run: ./gradlew :wear:assembleDebug --stacktrace

      - name: Verify the phone APK is signed
        run: |
          APK=$(find SparkyFitnessMobile/android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          echo "Phone APK: $APK"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -n 3

      - name: Upload phone APK
        uses: actions/upload-artifact@v4
        with:
          name: sparkyfitness-phone-apk
          path: SparkyFitnessMobile/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Wear OS APK
        uses: actions/upload-artifact@v4
        with:
          name: sparkyfitness-wear-apk
          path: SparkyFitnessMobile/targets/wear/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
