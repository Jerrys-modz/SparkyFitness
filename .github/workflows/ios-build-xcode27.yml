name: Build iOS (Xcode 27)

# Compile-only check of the iOS app on the Xcode 27 preview runner image. The
# on-device nutrition module (modules/on-device-nutrition) guards its
# FoundationModels code with `compiler(>=6.4)`, so it is only compiled by the
# Xcode 27 toolchain. `ios-build.yml` runs on macos-latest and does not cover it.
#
# Manual only. Xcode 27 is a preview runner image, so the job is allowed to
# fail without blocking anything.

on:
  workflow_dispatch:

concurrency:
  group: ios-build-xcode27-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile iOS app with Xcode 27
    runs-on: xcode-27
    continue-on-error: true
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # Must run from the repo root: the workspace patches @bacons/apple-targets.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild iOS project
        working-directory: SparkyFitnessMobile
        run: npx expo prebuild --platform ios

      - name: Build iOS app
        working-directory: SparkyFitnessMobile
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/SparkyFitness.xcworkspace \
            -scheme 'SparkyFitness' \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log

      # xcodebuild's own exit code is the real signal; this only surfaces
      # whether the module's Swift was actually compiled.
      - name: Confirm the on-device module was compiled
        if: always()
        working-directory: SparkyFitnessMobile
        run: grep -n "OnDeviceNutritionModule" xcodebuild.log | head -20 || echo "module not mentioned in build log"
