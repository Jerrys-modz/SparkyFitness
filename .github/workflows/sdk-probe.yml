name: sdk-probe
on:
  push:
    branches: [probe/sdk-fm]
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - name: Dump FoundationModels interface
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          f=$(find "$SDK/System/Library/Frameworks/FoundationModels.framework" -name "arm64e-apple-ios.swiftinterface" | head -1)
          echo "##### Tool protocol"; grep -nE "^public protocol Tool" -A22 "$f" | sed 's/FoundationModels:://g' | head -40
          echo "##### DynamicGenerationSchema"; grep -nE "class DynamicGenerationSchema|struct DynamicGenerationSchema" -A60 "$f" | grep -E "init|Property|case|static|anyOf|arrayOf|referenceTo" | sed 's/FoundationModels:://g' | head -40
          echo "##### GenerationSchema inits"; grep -nE "struct GenerationSchema" -A40 "$f" | grep -E "init" | sed 's/FoundationModels:://g' | head
          echo "##### GeneratedContent"; grep -nE "struct GeneratedContent" -A60 "$f" | grep -E "init|jsonString|var |func " | sed 's/FoundationModels:://g' | head -20
