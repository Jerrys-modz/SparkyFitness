name: sdk-probe
on:
  push:
    branches: [probe/sdk-fm]
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - name: Dump FoundationModels interface
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          f=$(find "$SDK/System/Library/Frameworks/FoundationModels.framework" -name "arm64e-apple-ios.swiftinterface" | head -1)
          echo "##### PCC head"; sed -n 40,64p "$f" | sed 's/FoundationModels:://g'
          echo "##### generic model inits"; grep -nE "some LanguageModel|any LanguageModel|<Model" "$f" | sed 's/FoundationModels:://g' | head -20
          echo "##### SystemLanguageModel variant"; grep -nE "enum Variant|case .*(small|large|standard|device)|var variant" "$f" | sed 's/FoundationModels:://g' | head
          echo "##### capabilities"; grep -nE "struct LanguageModelCapabilities" -A14 "$f" | sed 's/FoundationModels:://g' | head -24
