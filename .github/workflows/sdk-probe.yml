name: sdk-probe
on:
  push:
    branches: [probe/sdk-fm]
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - name: Dump FoundationModels interface
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          f=$(find "$SDK/System/Library/Frameworks/FoundationModels.framework" -name "arm64e-apple-ios.swiftinterface" | head -1)
          echo "##### Variant section"; grep -nE "Variant" "$f" | sed 's/FoundationModels:://g' | head -50
          echo "##### SystemLanguageModel inits"; grep -nE "convenience public init|public init|static var .*SystemLanguageModel|availableVariants|supportedVariants" "$f" | grep -iE "SystemLanguageModel|variant|useCase" | sed 's/FoundationModels:://g' | head -20
