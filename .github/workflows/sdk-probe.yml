name: sdk-probe
on:
  push:
    branches: [probe/sdk-fm]
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - name: Dump FoundationModels interface
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          f=$(find "$SDK/System/Library/Frameworks/FoundationModels.framework" -name "arm64e-apple-ios.swiftinterface" | head -1)
          echo "##### PCC static/init"; grep -nE "PrivateCloudComputeLanguageModel" "$f" | grep -E "static|init\(|default|shared" | sed 's/FoundationModels:://g' | head -20
          echo "##### SystemLanguageModel statics"; grep -nE "static (let|var) (default|shared)" "$f" | sed 's/FoundationModels:://g' | head
          echo "##### Variant"; sed -n 466,500p "$f" | sed 's/FoundationModels:://g'
          echo "##### Capability"; grep -nE "static (let|var) \w+: LanguageModelCapabilities.Capability|static let \w+: .*Capability" "$f" | sed 's/FoundationModels:://g' | head
