name: sdk-probe
on:
  push:
    branches: [probe/sdk-fm]
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - name: Dump FoundationModels interface
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          f=$(find "$SDK/System/Library/Frameworks/FoundationModels.framework" -name "arm64e-apple-ios.swiftinterface" | head -1)
          echo "##### default accessors"; grep -nE '`default`|convenience public init\(\)|public init\(\)' -B4 "$f" | sed 's/FoundationModels:://g' | head -60
          echo "##### variants"; grep -nE "static var (core|\w+): SystemLanguageModel.Variant" "$f" | head
