name: sdk-probe
on:
  push:
    branches: [probe/sdk-fm]
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - name: Dump FoundationModels interface
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          f=$(find "$SDK/System/Library/Frameworks/FoundationModels.framework" -name "arm64e-apple-ios.swiftinterface" | head -1)
          echo "##### lines 276-300"; sed -n 276,300p "$f" | sed 's/FoundationModels:://g'
          echo "##### lines 376-400"; sed -n 376,400p "$f" | sed 's/FoundationModels:://g'
          echo "##### lines 440-520"; sed -n 440,520p "$f" | sed 's/FoundationModels:://g'
