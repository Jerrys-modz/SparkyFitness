name: sdk-probe
on:
  push:
    branches: [probe/sdk-fm]
jobs:
  probe:
    runs-on: xcode-27
    steps:
      - name: Dump FoundationModels interface
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          f=$(find "$SDK/System/Library/Frameworks/FoundationModels.framework" -name "arm64e-apple-ios.swiftinterface" | head -1)
          echo "##### PCC section"; sed -n 30,160p "$f" | sed 's/FoundationModels:://g'
          echo "##### session inits"; grep -nE "LanguageModelSession.*init|convenience public init\(model|public init\(model|protocol LanguageModel\b|available\(" "$f" | sed 's/FoundationModels:://g' | head -40
          echo "##### quota"; sed -n 205,265p "$f" | sed 's/FoundationModels:://g'
          echo "##### SystemLanguageModel context"; sed -n 440,470p "$f" | sed 's/FoundationModels:://g'
