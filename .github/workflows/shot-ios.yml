name: Phone screenshots (not for the PR)

on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: macos-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Prebuild iOS project
        working-directory: SparkyFitnessMobile
        run: npx expo prebuild --platform ios
      - name: Build the app for the simulator with the screenshot bundle
        working-directory: SparkyFitnessMobile
        env:
          EXPO_PUBLIC_SHOT: "1"
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/SparkyFitness.xcworkspace \
            -scheme 'SparkyFitness' \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-phone \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
      - name: Capture phone screenshots
        working-directory: SparkyFitnessMobile
        run: |
          set -euo pipefail
          APP=$(find build-phone/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "App: $APP"
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "Bundle id: $BUNDLE_ID"
          mkdir -p screenshots
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime, entries in sorted(devices.items(), reverse=True):
              if 'iOS' in runtime:
                  for d in entries:
                      if 'iPhone' in d['name'] and 'Pro' in d['name'] and 'Max' not in d['name']:
                          print(d['udid']); sys.exit()
          ")
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl privacy "$UDID" grant all "$BUNDLE_ID" || true
          xcrun simctl launch "$UDID" "$BUNDLE_ID"
          # The app walks itself through the states every 20s after its JS starts.
          sleep 12;  xcrun simctl io "$UDID" screenshot screenshots/01-setup.png
          sleep 20;  xcrun simctl io "$UDID" screenshot screenshots/02-recording.png
          sleep 20;  xcrun simctl io "$UDID" screenshot screenshots/03-paused.png
          sleep 20;  xcrun simctl io "$UDID" screenshot screenshots/04-finished.png
          ls -la screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: phone-screenshots
          path: SparkyFitnessMobile/screenshots/*.png
          if-no-files-found: error
