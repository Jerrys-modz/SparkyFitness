name: Wear OS

on:
  pull_request:
    paths:
      - "SparkyFitnessMobile/targets/wear/**"
      - ".github/workflows/wear.yml"
  push:
    branches: [main]
    paths:
      - "SparkyFitnessMobile/targets/wear/**"
      - ".github/workflows/wear.yml"
  workflow_dispatch:

concurrency:
  group: wear-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Assemble Wear debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      APP_VARIANT: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # Matches targets/wear/gradle/wrapper/gradle-wrapper.properties.
          gradle-version: "8.11.1"

      - name: Point Gradle at the SDK
        working-directory: SparkyFitnessMobile/targets/wear
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Assemble the Wear app
        working-directory: SparkyFitnessMobile/targets/wear
        run: gradle :app:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm || true
          ls -l /dev/kvm || true

      # Same idea as the watchOS job in ios-build.yml: a seeded debug launch,
      # then a screenshot of each page. The emulator has no paired phone.
      - name: Capture Wear screenshots
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 30
          target: android-wear
          arch: x86
          profile: wearos_small_round
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-options: -no-snapshot -no-boot-anim -no-window -no-audio -gpu swiftshader_indirect
          script: bash SparkyFitnessMobile/targets/wear/screenshots.sh

      - name: Upload Wear screenshots
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wear-screenshots
          path: SparkyFitnessMobile/screenshots/*.png
          if-no-files-found: error
