name: Wear OS

on:
  pull_request:
    paths:
      - "SparkyFitnessMobile/targets/wear/**"
      - ".github/workflows/wear.yml"
  push:
    branches: [main]
    paths:
      - "SparkyFitnessMobile/targets/wear/**"
      - ".github/workflows/wear.yml"
  workflow_dispatch:

concurrency:
  group: wear-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Assemble Wear debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      APP_VARIANT: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Matches targets/wear/gradle/wrapper/gradle-wrapper.properties.
          gradle-version: "8.11.1"

      - name: Point Gradle at the SDK
        working-directory: SparkyFitnessMobile/targets/wear
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Assemble the Wear app
        working-directory: SparkyFitnessMobile/targets/wear
        run: gradle :app:assembleDebug --stacktrace

      # Same idea as the watchOS job in ios-build.yml: a seeded debug launch,
      # then a screenshot of each page. The emulator has no paired phone.
      - name: Capture Wear screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-wear
          arch: x86
          profile: wearos_small_round
          disable-animations: true
          emulator-options: -no-snapshot -no-boot-anim -no-window -no-audio
          script: |
            set -euo pipefail
            PKG=org.SparkyApps.SparkyFitnessMobile1.dev
            ACT=com.sparkyapps.sparkyfitness.wear.MainActivity
            APK=SparkyFitnessMobile/targets/wear/app/build/outputs/apk/debug/app-debug.apk
            mkdir -p SparkyFitnessMobile/screenshots
            adb install -r "$APK"
            shoot() {
              adb shell am force-stop "$PKG" || true
              adb shell am start -W -n "$PKG/$ACT" \
                --es sparky.screenshot 1 \
                --es sparky.workout "$2" \
                --es sparky.page "$3"
              sleep 6
              adb exec-out screencap -p > "SparkyFitnessMobile/screenshots/$1.png"
            }
            shoot workout-active active workout
            shoot workout-resting resting workout
            shoot workout-idle none workout
            shoot workout-exercises exercises workout
            shoot goals none goals
            shoot water none water
            shoot check-in none entry
            shoot trend none trend
            ls -la SparkyFitnessMobile/screenshots

      - name: Upload Wear screenshots
        uses: actions/upload-artifact@v4
        with:
          name: wear-screenshots
          path: SparkyFitnessMobile/screenshots/*.png
          if-no-files-found: error
