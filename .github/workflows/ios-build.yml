name: Build iOS & watchOS

# Compile-only check for the native Apple side. The Android workflow covers
# its own platform and `ci-tests.yml` covers the TypeScript, but nothing
# compiled the Swift until this existed — so a broken watch target or Expo
# native module could land unnoticed.
#
# Builds Debug rather than Release on purpose: the watch target's SwiftUI
# previews and its `SampleDay` fixtures are `#if DEBUG`, so a Release build
# would skip exactly the code most likely to rot.

on:
  workflow_dispatch:
  push:
    paths:
      - "SparkyFitnessMobile/**"
      - "shared/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "SparkyFitnessMobile/**"
      - "shared/**"
      - ".github/workflows/ios-build.yml"

# A second push to the same branch makes the first build irrelevant.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile iOS app and watchOS companion
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Show toolchain
        run: |
          xcodebuild -version
          echo "--- watchOS SDKs ---"
          xcodebuild -showsdks | grep -i watch || echo "no watchOS SDK on this image"

      # Must run from the repo root: the workspace patches @bacons/apple-targets,
      # and that patch is what stops prebuild corrupting the widget target.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild iOS project
        working-directory: SparkyFitnessMobile
        run: npx expo prebuild --platform ios

      - name: List generated schemes
        working-directory: SparkyFitnessMobile
        run: xcodebuild -list -workspace ios/SparkyFitness.xcworkspace

      # Runs before the host app on purpose. This is the target carrying the
      # watch app's own Swift, and the host-app build below has a known
      # pre-existing failure — putting that first would mask this result.
      - name: Build watchOS companion
        working-directory: SparkyFitnessMobile
        run: |
          xcodebuild \
            -workspace ios/SparkyFitness.xcworkspace \
            -scheme 'SparkyFitness Watch' \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # Non-blocking until the watch app icon is sorted out. Embedding the
      # watch target into the host app makes actool demand a full watchOS
      # AppIcon set, and targets/watch/expo-target.config.js still points at
      # the phone's adaptive icon ("swap for a dedicated Watch icon" per its
      # own TODO) — so this fails with "app icon set named AppIcon did not
      # have any applicable content", unrelated to any Swift in the diff.
      # Drop continue-on-error once a real watch icon lands.
      - name: Build iOS app (non-blocking)
        continue-on-error: true
        working-directory: SparkyFitnessMobile
        run: |
          xcodebuild \
            -workspace ios/SparkyFitness.xcworkspace \
            -scheme 'SparkyFitness' \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
