name: Build iOS & watchOS

# Compile-only check for the native Apple side. The Android workflow covers
# its own platform and `ci-tests.yml` covers the TypeScript, but nothing
# compiled the Swift until this existed — so a broken watch target or Expo
# native module could land unnoticed.
#
# The compile checks build Debug on purpose: the watch target's SwiftUI
# previews and its `SampleDay` fixtures are `#if DEBUG`, so a Release build
# would skip exactly the code most likely to rot. The phone screenshot job is
# the one deliberate exception, for the reason stated there.
#
# Two jobs rather than one, and they run in parallel. The watch scheme builds
# the containing iOS app with it, so a single job got the Debug Pods for free
# and then had to build every Pod again from scratch for the Release
# screenshot — the two together ran past the job timeout. Split, the wall
# clock is the slower of the two instead of their sum, and neither can starve
# the other of time.

on:
  workflow_dispatch:
  push:
    paths:
      - "SparkyFitnessMobile/**"
      - "shared/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "SparkyFitnessMobile/**"
      - "shared/**"
      - ".github/workflows/ios-build.yml"

# A second push to the same branch makes the first build irrelevant.
concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile iOS app and watchOS companion
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Show toolchain
        run: |
          xcodebuild -version
          echo "--- watchOS SDKs ---"
          xcodebuild -showsdks | grep -i watch || echo "no watchOS SDK on this image"

      # Must run from the repo root: the workspace patches @bacons/apple-targets,
      # and that patch is what stops prebuild corrupting the widget target.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild iOS project
        working-directory: SparkyFitnessMobile
        run: npx expo prebuild --platform ios

      - name: List generated schemes
        working-directory: SparkyFitnessMobile
        run: xcodebuild -list -workspace ios/SparkyFitness.xcworkspace

      # Scheme name comes from `name` in targets/watch/expo-target.config.js.
      # Note it is NOT "SparkyFitness Watch" — there is a sibling
      # SparkyFitnessWatchWidget target, so match this exactly.
      - name: Build watchOS companion
        working-directory: SparkyFitnessMobile
        run: |
          xcodebuild \
            -workspace ios/SparkyFitness.xcworkspace \
            -scheme 'SparkyFitnessWatch' \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Build iOS app
        working-directory: SparkyFitnessMobile
        run: |
          xcodebuild \
            -workspace ios/SparkyFitness.xcworkspace \
            -scheme 'SparkyFitness' \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      # Screenshots of the watch app, for PRs that change its UI. A simulator
      # has no paired phone, so every page would otherwise render its "not
      # synced yet" state — the DEBUG-only ScreenshotSeed fills the stores
      # from SampleDay at launch instead. It is also the only way to capture
      # a live heart rate: there is no sensor behind HKLiveWorkoutBuilder in
      # a simulator, so the BPM layout never appears on real hardware here.
      - name: Capture watch screenshots
        working-directory: SparkyFitnessMobile
        run: |
          set -euo pipefail

          APP="build/Build/Products/Debug-watchsimulator/SparkyFitnessWatch.app"
          BUNDLE_ID="org.SparkyApps.SparkyFitnessMobile1.dev.watchkitapp"
          mkdir -p screenshots

          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime, entries in devices.items():
              if 'watchOS' in runtime and entries:
                  print(entries[0]['udid'])
                  break
          ")
          if [ -z "${UDID:-}" ]; then
            echo 'No watchOS simulator available on this image:'
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using watch simulator $UDID"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"

          # $1 = output name, $2 = SPARKY_SCREENSHOT_WORKOUT, $3 = page,
          # $4 = optional SPARKY_SCREENSHOT_SHEET
          shoot() {
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            SIMCTL_CHILD_SPARKY_SCREENSHOT_SEED=1 \
            SIMCTL_CHILD_SPARKY_SCREENSHOT_WORKOUT="$2" \
            SIMCTL_CHILD_SPARKY_SCREENSHOT_PAGE="$3" \
            SIMCTL_CHILD_SPARKY_SCREENSHOT_SHEET="${4:-}" \
              xcrun simctl launch "$UDID" "$BUNDLE_ID"
            # SwiftUI needs a moment to settle, and the rest countdown needs
            # to actually be counting before it is worth photographing.
            sleep 8
            xcrun simctl io "$UDID" screenshot "screenshots/$1.png"
          }

          shoot workout-active active workout
          shoot workout-resting resting workout
          shoot workout-idle none workout
          shoot workout-exercises active workout exercises
          shoot goals none goals

          ls -la screenshots

      - name: Upload watch screenshots
        uses: actions/upload-artifact@v4
        with:
          name: watch-screenshots
          path: SparkyFitnessMobile/screenshots/*.png
          if-no-files-found: error

  phone-screenshot:
    name: Photograph the phone's workout detail screen
    runs-on: macos-latest
    # Longer than the compile job: this one builds every Pod in Release from
    # scratch, which is most of the hour.
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      # Must run from the repo root: the workspace patches @bacons/apple-targets,
      # and that patch is what stops prebuild corrupting the widget target.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prebuild iOS project
        working-directory: SparkyFitnessMobile
        run: npx expo prebuild --platform ios

      # The one Release build in this workflow, and that is not incidental:
      # expo-dev-client owns the first screen of a Debug build, so a Debug run
      # photographs its "Searching for development servers..." launcher no
      # matter how the JS is bundled. Its takeover is `#if DEBUG`, so Release
      # goes straight to the app, and the Release build phase embeds the
      # bundle by itself -- no FORCE_BUNDLING, and no Metro server needed at
      # runtime. EXPO_PUBLIC_SCREENSHOT_SEED is inlined at bundle time and
      # sends the app to the workout detail screen with a fixture session.
      # Kept out of the compile job so that stays an honest check of the
      # configuration developers actually build.
      - name: Build iOS app with the screenshot seed
        working-directory: SparkyFitnessMobile
        env:
          EXPO_PUBLIC_SCREENSHOT_SEED: "1"
        run: |
          xcodebuild \
            -workspace ios/SparkyFitness.xcworkspace \
            -scheme 'SparkyFitness' \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Capture phone screenshots
        working-directory: SparkyFitnessMobile
        run: |
          set -euo pipefail

          APP="build/Build/Products/Release-iphonesimulator/SparkyFitness.app"
          BUNDLE_ID="org.SparkyApps.SparkyFitnessMobile1.dev"
          SHOT="screenshots/workout-detail-hr.png"
          mkdir -p screenshots

          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          for runtime, entries in devices.items():
              if 'iOS' in runtime:
                  for entry in entries:
                      if entry['name'].startswith('iPhone'):
                          print(entry['udid'])
                          raise SystemExit
          ")
          if [ -z "${UDID:-}" ]; then
            echo 'No iPhone simulator available on this image:'
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using iPhone simulator $UDID"

          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          # A pinned status bar makes the shot reproducible and, more to the
          # point here, stops the clock ticking underneath the settle check.
          xcrun simctl status_bar "$UDID" override \
            --time '9:41' --batteryState charged --batteryLevel 100 || true
          # One second of checking against the likeliest cause of a Release
          # build that launches and dies: no embedded JS. Debug gets away
          # without it because Metro serves the bundle; Release has only this
          # file, and an app that cannot find it exits before drawing
          # anything.
          if [ ! -f "$APP/main.jsbundle" ]; then
            echo "::error::No main.jsbundle in the app bundle -- the Release bundling phase did not produce one."
            ls -la "$APP" | head -40
            exit 1
          fi

          xcrun simctl install "$UDID" "$APP"

          # Started before the app so nothing is missed. If the app dies on
          # launch this is the only place that says why: there is no Metro to
          # print to, and a Release build has no redbox.
          APP_LOG="$RUNNER_TEMP/app.log"
          xcrun simctl spawn "$UDID" log stream --level debug \
            --predicate 'processImagePath CONTAINS "SparkyFitness"' \
            > "$APP_LOG" 2>&1 &
          LOG_PID=$!

          # `simctl launch` prints "<bundle id>: <pid>".
          PID=$(xcrun simctl launch "$UDID" "$BUNDLE_ID" | awk -F': ' '{print $2}')
          echo "Launched as PID ${PID:-unknown}"

          # React Native's first frame is well behind process launch: the
          # bridge starts, the bundle is parsed, then navigation mounts. Rather
          # than guess one sleep, wait for two consecutive identical frames --
          # with the clock pinned, an unchanged screen means the UI settled.
          # The opening wait is what stops the launch screen matching itself.
          sleep 20
          previous=""
          for _ in $(seq 1 10); do
            rm -f "$SHOT.tmp"
            xcrun simctl io "$UDID" screenshot --type=png "$SHOT.tmp"
            mv -f "$SHOT.tmp" "$SHOT"
            current=$(shasum -a 256 "$SHOT" | cut -d ' ' -f 1)
            if [ "$current" = "$previous" ]; then
              break
            fi
            previous="$current"
            sleep 5
          done

          kill "$LOG_PID" 2>/dev/null || true

          # The settle check cannot tell a finished screen from a dead app:
          # SpringBoard is perfectly still too, so a crash satisfies it in two
          # frames and the job goes green around a photograph of the home
          # screen. Asking whether the process is still there is what
          # distinguishes them.
          if [ -z "${PID:-}" ] || ! ps -p "$PID" > /dev/null 2>&1; then
            echo "::error::The app exited after launch; the screenshot is of whatever replaced it."
            echo '--- last 150 lines of the app log ---'
            tail -150 "$APP_LOG" || true
            echo '--- most recent crash reports ---'
            for report in $(ls -t "$HOME"/Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -3); do
              echo "== $report"
              head -80 "$report" || true
            done
            exit 1
          fi
          echo "App still running after the settle loop."

          # xcodebuild's environment dump pushes the tail of this job past
          # where GitHub truncates a log, so report into the step summary too.
          {
            echo '### Screenshots'
            echo '```'
            ls -la screenshots
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          ls -la screenshots

      # always(), because a screenshot of the wrong thing is the evidence for
      # working out what went wrong.
      - name: Upload phone screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phone-screenshots
          path: SparkyFitnessMobile/screenshots/*.png
          if-no-files-found: error
