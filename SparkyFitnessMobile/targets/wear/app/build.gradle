apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

  def appVariant = System.getenv('APP_VARIANT') ?: 'dev'
  def phoneAppId = (appVariant == 'dev' || appVariant == 'development')
    ? (System.getenv('EXPO_DEV_BUNDLE_IDENTIFIER') ?: 'org.SparkyApps.SparkyFitnessMobile1.dev')
    : 'com.SparkyApps.SparkyFitnessMobile'

android {
  namespace 'com.sparkyapps.sparkyfitness.wear'
  compileSdk 35

  defaultConfig {
    // Same id as the phone, or the Data Layer will not deliver anything.
    applicationId phoneAppId
    minSdk 30
    targetSdk 34
    versionCode 1
    versionName '1.0.0'
  }

  buildTypes {
    release {
      minifyEnabled false
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = '17'
  }

  buildFeatures {
    compose true
  }
}

dependencies {
  implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
  implementation 'androidx.activity:activity-compose:1.9.3'
  implementation 'androidx.compose.ui:ui:1.7.6'
  implementation 'androidx.compose.foundation:foundation:1.7.6'
  implementation 'androidx.wear.compose:compose-foundation:1.4.1'
  implementation 'androidx.wear.compose:compose-material:1.4.1'
  implementation 'androidx.health:health-services-client:1.1.0'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
  implementation 'com.google.android.gms:play-services-wearable:19.0.0'
  implementation 'com.google.guava:guava:33.3.1-android'
}
