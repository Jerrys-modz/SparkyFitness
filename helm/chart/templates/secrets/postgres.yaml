{{- if and (not .Values.postgresql.enabled) (include "sparkyfitness.createDatabaseSecret" .) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "sparkyfitness.databaseSecretName" . }}
  labels:
    {{- include "sparkyfitness.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ required "externalDatabase.auth.username is required when creating the database secret (set the value or use existingSecret/ESO)" .Values.externalDatabase.auth.username | b64enc }}
  password: {{ required "externalDatabase.auth.password is required when creating the database secret (set the value or use existingSecret/ESO)" .Values.externalDatabase.auth.password | b64enc }}
{{- end }}
